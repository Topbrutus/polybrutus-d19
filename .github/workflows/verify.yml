name: Verify Polybrutus D19 exact certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact symbolic mathematics
        run: python -m pip install sympy==1.14.0
      - name: Certify D19 276-pair Euclidean metric, Gram and theoretical graph
        run: python src/verify_d19.py
      - name: Independently check 276 rational distances and model spectral roots
        run: python tests/independent_d19.py
